[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "progretech-seesaw"
version = "0.1.0.dev0"
description = "Offline-first Ubuntu slicing workflow — project foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = ["trimesh>=4.9,<5", "numpy>=2.2,<3"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "pyvista>=0.46,<0.48", "pyvistaqt>=0.11,<0.12"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
seesaw = "seesaw.cli:main"
seesaw-desktop = "seesaw.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seesaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
